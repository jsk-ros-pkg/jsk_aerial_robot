servo_controller:
  # ServoControlCmd uses the global id. Configuration uses board_id plus the
  # board-local servo_index; the MCU resolves the physical Dynamixel ID.
  auto_configure_direct_servo: true
  direct_servo_config_timeout: 10.0
  # Keep calls serialized and leave time for low-level state/flash processing.
  direct_servo_config_call_interval: 0.02
  direct_servo_config_startup_delay: 1.0
  servo_feedback_frequency: 200
  servo_target_watchdog: 0.1
  dynamixel_ttl_rs485_mixed: true

  gimbals:
    no_real_state: false
    board_id: 1
    bus_type: T

    # Beetle omni gimbal servo: Dynamixel XC330-T181.
    angle_sgn: 1
    angle_scale: 0.001533981
    velocity_scale: 0.02398082
    torque_scale: 0.00064
    zero_point_offset: 2048
    p_gain: 1200
    i_gain: 0
    d_gain: 500
    profile_velocity: 0
    current_limit: 2352
    send_data_flag: true
    external_encoder_flag: false
    joint_resolution: 1
    servo_resolution: 1

    # id remains the global ServoControlCmd index.
    controller1:
      id: 0
      servo_index: 0
      name: gimbal1
      mode: MIT
      mit_kp_si: 0.45
      mit_kd_si: 0.008

    controller2:
      id: 1
      servo_index: 1
      name: gimbal2
      mode: DP

    controller3:
      id: 2
      servo_index: 2
      name: gimbal3
      mode: MIT
      mit_kp_si: 0.45
      mit_kd_si: 0.008

    # Logical id 3 is the Dragon joint servo (Dynamixel XM430-W350-R) on the
    # RS485 branch. Its scaling and register configuration differ from XC330.
    controller4:
      id: 3
      servo_index: 3
      mode: DP
      name: gimbal4
      bus_type: R
      angle_scale: 0.00076699
      velocity_scale: 0.01199041
      torque_scale: 0.0106
      zero_point_offset: 2047
      p_gain: 800
      i_gain: 0
      d_gain: 0
      profile_velocity: 0
      current_limit: 1193
